name: CI

permissions:
  contents: write

on:
  push: # Triggers on every push to any branch
  pull_request: # Triggers on every pull request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # This creates the local.properties file required by your build Src logic
      - name: Create local.properties
        run: |
          echo "anilist.id=${{ secrets.ANILIST_ID }}" >> local.properties
          echo "anilist.secret=${{ secrets.ANILIST_SECRET }}" >> local.properties
          echo "mal.id=${{ secrets.MAL_ID }}" >> local.properties
          echo "mal.secret=${{ secrets.MAL_SECRET }}" >> local.properties
          # Replaces empty secret references with dummy values so build doesn't crash
          sed -i 's/=${{ secrets.* }}/=dummy_value/g' local.properties

      - name: Decode Keystore and Setup Secrets
        env:
          ENCODED_KEYSTORE: ${{ secrets.ENCODED_KEYSTORE }}
          CLIENT_SECRETS_TEXT: ${{ secrets.CLIENT_SECRETS_TEXT }}
        run: |
          if [ ! -z "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 --decode > keystore.jks
          fi
          if [ ! -z "$CLIENT_SECRETS_TEXT" ]; then
            mkdir -p app/src/main/assets
            echo "$CLIENT_SECRETS_TEXT" > app/src/main/assets/client_secrets.json
          fi

      - name: Build app
        run: ./gradlew assembleDebug
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: animetail-debug
          path: app/build/outputs/apk/debug/*.apk
